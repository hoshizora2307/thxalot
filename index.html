<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For SHIZU - Eternal Gratitude</title>
    <!-- 近未来的なフォントの読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --star-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Noto Sans JP', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* メインUI */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* タップを背後のCanvasに透過させる */
        }

        .name-shizu {
            font-family: 'Zen Dots', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-blue);
            letter-spacing: 0.5rem;
            margin-bottom: 20px;
        }

        .instruction {
            color: var(--neon-blue);
            font-size: 0.8rem;
            letter-spacing: 0.2rem;
            opacity: 0.6;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="overlay">
        <div class="name-shizu">SHIZU</div>
        <div class="instruction">TAP TO SEND GRATITUDE</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let flowingTexts = [];
        const words = ["ありがとう", "感謝", "SHIZU", "THANK YOU", "心から", "絆", "光", "ETERNAL"];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 流れる文字のオブジェクト
        class FloatingText {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 200;
                this.speed = 1 + Math.random() * 2;
                this.text = words[Math.floor(Math.random() * words.length)];
                this.opacity = Math.random() * 0.5 + 0.1;
                this.fontSize = Math.random() * 20 + 15;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.font = `bold ${this.fontSize}px 'Zen Dots', sans-serif`;
                ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        // タップ時の星の粒子
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.velocityX = Math.cos(angle) * speed;
                this.velocityY = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.life -= this.decay;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f3ff";
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 20; i++) flowingTexts.push(new FloatingText());

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)'; // 残像効果
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            flowingTexts.forEach(t => { t.update(); t.draw(); });

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        // タップイベント
        function handleTap(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            
            // 放射状に星を生成
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y));
            }
        }

        window.addEventListener('touchstart', handleTap);
        window.addEventListener('mousedown', handleTap);
        window.addEventListener('resize', init);

        init();
        animate();
    </script>
</body>
</html>
