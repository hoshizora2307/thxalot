<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratitude for SHIZU</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --deep-purple: #0a0a12;
            --text-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--deep-purple);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景のノイズ演出 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        /* メインの名前表示 */
        .target-name {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 2rem;
            position: relative;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* 感謝の言葉が流れるエリア */
        .message-wall {
            height: 300px;
            overflow: hidden;
            position: relative;
        }

        .scroll-text {
            display: flex;
            flex-direction: column;
            animation: scrollUp 15s linear infinite;
        }

        .message-item {
            font-size: 1.5rem;
            margin: 1rem 0;
            opacity: 0.7;
            transition: 0.3s;
        }

        .message-item:hover {
            color: var(--neon-blue);
            opacity: 1;
            transform: skewX(-10deg);
        }

        @keyframes scrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }

        /* 近未来的装飾 */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            top: 0;
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanner-line"></div>

    <div class="container">
        <div class="target-name">SHIZU</div>
        
        <div class="message-wall">
            <div class="scroll-text" id="messages">
                <!-- JavaScriptでメッセージを生成 -->
            </div>
        </div>
    </div>

    <script>
        const texts = [
            "言葉では足りないほどの感謝を",
            "しづと兄貴の存在が僕の光",
            "心からの「ありがとう」を込めて",
            "未来へ続く感謝の軌跡",
            "しづと兄貴へ、最大の敬意を",
            "かけがえのない絆に感謝",
            "しづの優しさに救われています",
            "この想いが届きますように"
        ];

        const container = document.getElementById('messages');
        
        // メッセージを2回繰り返してシームレスなループにする
        [...texts, ...texts].forEach(text => {
            const div = document.createElement('div');
            div.className = 'message-item';
            div.textContent = text;
            container.appendChild(div);
        });
    </script>
</body>
</html>
